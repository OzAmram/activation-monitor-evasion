[project]
name = "multihop"
version = "0.1.0"
description = "Can a model hide a task-necessary concept from activation monitors?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "transformers>=4.46",
    "accelerate>=1.0",
    "safetensors",
    "huggingface_hub[hf_transfer]",
    "datasets",
    "pandas",
    "pyarrow",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "pyyaml",
    "tqdm",
]

[dependency-groups]
dev = ["pytest", "ipykernel"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multihop"]
