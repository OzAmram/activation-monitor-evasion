# Qwen3.8-27B (dense, hybrid linear/full attention; 64 layers, hidden 5120; multimodal wrapper). Thinking disabled.
model_id: Qwen/Qwen3.8-27B
dtype: bfloat16
device_map: auto
k_positions: 8            # last K prompt tokens recorded / intervened on
store_layers: null        # null = all layers; else a list of depth fractions, e.g. [0.25, 0.5, 0.75]
middle_band: [0.25, 0.75] # half-open band of depth fractions (64 layers -> layers 16..47)
seed: 0
batch_size: 16
chat_template_kwargs:
  enable_thinking: false
